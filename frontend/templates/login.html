<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="form-card narrow">
      <h2>Welcome back</h2>
      <p class="subtitle">Log in with your VIT email to buy and sell.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">VIT email</label>
          <input id="email" type="email" placeholder="name@vitstudent.ac.in" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn-block">Login</button>
      </form>

      <p id="message" class="form-message"></p>
      <p class="alt">New here? <a href="/register">Create an account</a></p>
    </section>
  </main>

  <footer class="site-footer">Campus Cart · Made for VIT students, by VIT students</footer>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
