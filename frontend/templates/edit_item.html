<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Item - Campus Cart</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <h1>Campus Cart</h1>
    <p>Edit your listing</p>
  </header>

  <main>
    <section class="hero">
      <h2>Edit Item</h2>

      <form id="editItemForm">
        <input id="title" type="text" placeholder="Item title" required>
        <br><br>

        <textarea id="description" placeholder="Description" required></textarea>
        <br><br>

        <select id="category" required>
          <option value="Textbooks">Textbooks</option>
          <option value="Electronics">Electronics</option>
          <option value="Furniture">Furniture</option>
          <option value="Stationery">Stationery</option>
          <option value="Lab Equipment">Lab Equipment</option>
        </select>
        <br><br>

        <select id="itemCondition" required>
          <option value="New">New</option>
          <option value="Like New">Like New</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
        </select>
        <br><br>

        <input id="price" type="number" min="1" placeholder="Price in ₹" required>
        <br><br>

        <button type="submit">Save Changes</button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <script src="/static/js/edit_item.js"></script>
</body>
</html>
